<li class="menu-item" 
    [class.has-children]="menu.details && menu.details.length > 0" 
    [class.is-expanded]="isMenuExpanded(menu.id)">
  
  <!-- Parent Menu with Children -->
  <div *ngIf="menu.details && menu.details.length > 0" 
       class="menu-parent" 
       (click)="toggleMenu(menu.id)">
    <div class="menu-label">
      <div class="menu-title-group">
        <i [class]="getMenuIcon(menu)" class="menu-icon"></i>
        <span class="menu-text">{{ menu.menu }}</span>
      </div>
      <i class="fas fa-chevron-right toggle-icon" [class.rotated]="isMenuExpanded(menu.id)"></i>
    </div>
  </div>
  
  <!-- Leaf Menu Link (no children) -->
  <div *ngIf="!menu.details || menu.details.length === 0" class="menu-leaf">
    <a *ngIf="checkUrl(menu)" 
       [routerLink]="[menu.frontUrl]" 
       routerLinkActive="active-menu" 
       class="menu-link">
      <div class="menu-title-group">
        <i [class]="getMenuIcon(menu)" class="menu-icon"></i>
        <span class="menu-text">{{ menu.menu }}</span>
      </div>
    </a>
  </div>

  <!-- Recursive Sub-Menus -->
  <ul *ngIf="menu.details && menu.details.length > 0 && isMenuExpanded(menu.id)" 
      class="sub-menu">
    <app-item-menu 
      *ngFor="let child of menu.details"
      [menu]="child"
      [level]="level + 1">
    </app-item-menu>
  </ul>
</li>
